# 独立的 Android APK 发布流水线
#
# 设计前提：完全不碰 aierlma 原有的 iOS 流水线（.github/workflows/btr-maintain.yml）
# 与发布脚本（tool/btr_release.py）——那两个文件里写死了 aierlma/PiliPlus 仓库名，
# 在 fork 里本来就会拒绝运行。本文件只做一件事：
#   构建 aierlma/PiliPlus 的 btr 最新提交 → 产出 3 个 ABI 拆分的 release APK → 打自己的 tag 发 release。
#   它不读也不改你 fork 的 btr 内容，只借一个专用分支 btr-android-build 寄存构建用的提交。
#
# 发布语义（正式版 / 预览版）：
#   判定基准是**本仓库最新正式版的版本号**（REST 里 /releases/latest 的定义就是「最近的非 draft、
#   非预发布 release」，所以它天然给出上一次发正式版时的版本号）：
#   本次构建的 version 与它不同 → 正式 release（会成为 Latest）；相同 → 同版本滚动重建，发 pre-release
#   （pre-release 不会被设成 Latest，因此不需要 make_latest）。即「只有上游 pubspec.yaml 的版本号变了，
#   Latest 才前进」。每个版本号的第一份构建成功的包就是它的正式版；版本号变更的那个提交若构建失败，
#   后面同版本的成功构建会补上正式版。仓库还没有正式 release 时按正式版发布。
#   理由：这条流水线的产物是基于上游 main 的每日滚动构建，本身就不稳定，**本来就不该算 release**；
#   只有 pubspec.yaml 的版本号刷新才代表「发了一版」，那一次才配得上正式 release 与 Latest。
#   因此**不设回切方案**：即便 Watch → Releases only 收不到 pre-release 通知，也符合预期（不稳定构建
#   不该当成 release 推给用户），不要改成 make_latest: false。用户端在版本号不变期间安静是正常的。
#
# 应用内更新（本 fork 的 APK）：
#   应用里的「检查更新」（lib/utils/update.dart 的非 iOS 分支）原生读的是 aierlma 的
#   /releases，且用 release 的 created_at 与构建时写入的 pili.time 比较 —— 对我们这个 fork
#   既会弹上游、又必然假报（created_at 总比 pili.time 晚，装完第一次检查就提示「当前这一版」）。
#   所以构建前打一个补丁（见「把应用内更新检查指向本 fork」步骤）：把 latestApp / sourceCodeUrl
#   指向本仓库，并把判据换成「本仓库最新**正式版**的构建号 > 自身 versionCode」。只认正式版 →
#   同版本号的滚动构建（pre-release）不会提示，与上面的发布语义一致。
#   补丁是精确匹配，上游改过那几行就会构建失败提醒重写补丁，不会静默失效。
#   「应用内下载+安装」（REQUEST_INSTALL_PACKAGES + FileProvider + 原生 Intent）已评估且决定
#   不做：要动原生层、本机又没有 Android SDK 无法编译验证，性价比不划算，保持浏览器直链。
#
# 首次使用需要手动做三件事：
#   1. fork 的 Actions 页点「I understand my workflows, go ahead and enable them」；
#   2. 确认本文件待在**默认分支**（`apk-pipeline`）上，且本 workflow 处于 Enabled 状态：
#      schedule / workflow_dispatch 只认默认分支；把本文件放在 btr 之外，正是为了让 Sync fork
#      无法把它一起重置掉（btr 只用来跟随上游）；
#   3. 可选：配置签名 secrets（SIGN_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），
#      不配置则回退为 debug 签名（能装，但签名与自建 release 签名不通用）。

name: BTR Android APK release

on:
  schedule:
    # 每天 UTC 12:47（北京时间 20:47）。aierlma 的 iOS 流水线是 UTC 11:17 触发，
    # 留出约 90 分钟让它先把合并后的 btr 分支推上去，这里才不会构建到旧代码。
    - cron: '47 12 * * *'
  # 只在流水线自身定义变更时触发一次：既能自动验证对本文件的改动，也让人无需 gh CLI 就能跑一次。
  # 用 paths 限定，所以同步 fork、改业务代码都不会触发。
  # 分支跟到本文件所在的默认分支 apk-pipeline（见文件头说明）。
  push:
    branches: [apk-pipeline]
    paths:
      - .github/workflows/android-release.yml
  workflow_dispatch:
    inputs:
      force:
        description: 即使该版本已经发过 release，也重新构建并覆盖附件
        type: boolean
        default: false

concurrency:
  group: btr-android-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # aierlma/PiliPlus：BTR + 上游合并后的 btr 分支，本流水线的构建来源
  SOURCE_REPO: https://github.com/aierlma/PiliPlus.git
  # 官方 PiliPlus（仅用于在 build-info.json 里记录基线）
  UPSTREAM_REPO: https://github.com/bggRGjQaUbCoE/PiliPlus.git
  # BTR 作者的上游（仅用于在 build-info.json 里记录基线）
  BTR_UPSTREAM_REPO: https://github.com/nishuodedui1145-del/PiliPlus.git

jobs:
  resolve:
    name: 解析构建来源与目标 tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.target.outputs.skip }}
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.target.outputs.version }}
      build: ${{ steps.target.outputs.build }}
      tag: ${{ steps.target.outputs.tag }}
      prerelease: ${{ steps.target.outputs.prerelease }}
      upstream: ${{ steps.target.outputs.upstream }}
      btr_upstream: ${{ steps.target.outputs.btr_upstream }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: btr
          fetch-depth: 0
          persist-credentials: false

      - name: 解析来源提交、版本号与 tag
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # 恒定构建 aierlma/PiliPlus 的 btr 最新提交 —— 也就是它那些 IPA 对应的代码。
          # 不构建 fork 自己的 btr：本文件不在 btr 上，也不读 btr 的内容，所以 fork 的 btr 落后或分叉都没有影响。
          # ⚠️ 不要对 btr 用 Sync fork → Discard commits：那会强制重置该分支、丢掉本地提交。
          #    要让 btr 跟上上游就用 Merge，或者干脆不动它。
          git fetch --no-tags "$SOURCE_REPO" btr
          target=$(git rev-parse FETCH_HEAD)

          git fetch --no-tags "$UPSTREAM_REPO" main
          upstream=$(git rev-parse FETCH_HEAD)
          git fetch --no-tags "$BTR_UPSTREAM_REPO" btr
          btr_upstream=$(git rev-parse FETCH_HEAD)

          version=$(git show "$target:pubspec.yaml" | sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' | head -n1)
          if [ -z "$version" ]; then
            echo "::error::无法从 $target 的 pubspec.yaml 解析版本号"
            exit 1
          fi
          build=$(git rev-list --count "$target")
          tag="v${version}-btr.${build}-${target:0:12}-android"

          # 正式版 / 预览版判定：基准是**本仓库最新正式版的版本号**（REST 里 /releases/latest 的定义就是
          # 「最近的非 draft、非预发布 release」，所以它天然给出上一次发正式版时的版本号）。
          # 本次 version 与它不同 → 正式 release；相同 → 同版本滚动重建，发 pre-release。
          # 仓库还没有正式版（该请求 404）或 API 临时失败时按正式版发布并告警，不静默改语义。
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          latest_version=${latest_tag#v}
          latest_version=${latest_version%%-btr.*}
          if [ -z "$latest_version" ]; then
            echo "::warning::读不到本仓库的最新正式版（可能还没有正式 release，或 API 临时失败）；本次按正式版发布"
            prerelease=false
          elif [ "$version" != "$latest_version" ]; then
            prerelease=false
          else
            prerelease=true
          fi
          echo "最新正式版版本号：${latest_version:-无}，本次 version=$version → prerelease=$prerelease"

          # 同一个来源提交已经发过就直接跳过，省掉一次 30 分钟以上的构建。
          skip=false
          if [ "$FORCE" != "true" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag 已存在，跳过本次构建"
            skip=true
          fi

          {
            echo "sha=$target"
            echo "version=$version"
            echo "build=$build"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "upstream=$upstream"
            echo "btr_upstream=$btr_upstream"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

  build:
    name: 构建 APK 并发布 release
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: btr
          fetch-depth: 0

      # build job 是全新的 runner，fork 里可能还没有 aierlma 那条流水线新推的提交，所以先取到目标提交。
      # release 的 tag 必须指向 fork 里真实存在的提交，所以把它寄存到专用分支 btr-android-build 上，
      # 完全不动你的 btr 分支。aierlma 的 btr 只会往前走，因此这是一条非强制的快进推送。
      - name: 取出目标提交并落到专用分支
        env:
          TARGET: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${TARGET}^{commit}" 2>/dev/null; then
            git fetch --no-tags "$SOURCE_REPO" btr
          fi
          if ! git cat-file -e "${TARGET}^{commit}" 2>/dev/null; then
            echo "::error::无法取得目标提交 $TARGET"
            exit 1
          fi
          git push origin "${TARGET}:refs/heads/btr-android-build"
          git checkout --detach "$TARGET"

      - name: 构建 Java 环境
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 打 Flutter SDK 与 material_ui 补丁（含 flutter pub get）
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      # 见文件头「应用内更新」：应用内检查更新原生指向 aierlma 的 release，而且判据（release 的
      # created_at 比构建时写入的 pili.time）对我们这个 fork 必然假报，所以构建前改成：
      #   ① latestApp / sourceCodeUrl 指向本仓库；② 判据改成按「最新正式版的构建号」比较。
      # 顺带往 update.dart 里加一个解析 Android 发布契约的 BtrAndroidRelease（对应 iOS 的 BtrIosRelease）。
      # 三处替换都要求精确匹配：上游改过就 exit 1，绝不静默失效（与上面修竞速测试参数那步同一风格）。
      - name: 把应用内更新检查指向本 fork
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys

          REPO = 'sodaa-l/PiliPlus'


          def patch(path, old, new, expect=1):
              file = pathlib.Path(path)
              text = file.read_text(encoding='utf-8')
              found = text.count(old)
              if found != expect:
                  print('::error::%s 里匹配到 %d 处（期望 %d 处），上游可能改过这段，'
                        '请核对后再决定保留还是删除本补丁' % (path, found, expect))
                  sys.exit(1)
              file.write_text(text.replace(old, new), encoding='utf-8')
              print('%s：替换 %d 处' % (path, found))


          def replace_block(path, old_lines, new_lines):
              # 按「去掉首尾空白后的整行内容」匹配连续若干行，替换后沿用原缩进，
              # 这样本补丁里写的 Dart 片段不必跟着文件的缩进走。
              file = pathlib.Path(path)
              lines = file.read_text(encoding='utf-8').split('\n')
              expected = [line.strip() for line in old_lines]
              for start in range(len(lines) - len(expected) + 1):
                  if [line.strip() for line in lines[start:start + len(expected)]] == expected:
                      head = lines[start]
                      indent = head[:len(head) - len(head.lstrip())]
                      lines[start:start + len(expected)] = [
                          indent + line if line else '' for line in new_lines
                      ]
                      file.write_text('\n'.join(lines), encoding='utf-8')
                      print('%s：第 %d 行起，%d 行 -> %d 行'
                            % (path, start + 1, len(expected), len(new_lines)))
                      return
              print('::error::%s 里找不到预期的那 %d 行，上游可能改过这段，'
                    '请核对后再决定保留还是删除本补丁' % (path, len(expected)))
              sys.exit(1)


          OLD_BRANCH = '''
          data = Map<String, dynamic>.from(res.data[0] as Map);
          final latest =
          DateTime.parse(data['created_at']).millisecondsSinceEpoch ~/ 1000;
          hasUpdate = BuildConfig.buildTime < latest;
          '''.strip('\n').split('\n')

          NEW_BRANCH = '''
          // 本 fork 的 Android 包：只认本仓库的**正式版**（同版本号的滚动重建是 pre-release，
          // 按发布语义不算发版），并以 tag 里的构建号与自身 versionCode 比较。
          // 不能用 release 的 created_at 比：它比构建时写入的 pili.time 晚，
          // 装完第一次检查就会假报「当前这一版」有新版本。
          final releases = <BtrAndroidRelease>[];
          if (res.data is List) {
            for (final item in res.data as List) {
              final release = BtrAndroidRelease.parse(item);
              if (release != null) releases.add(release);
            }
          }
          releases.sort((a, b) => b.build.compareTo(a.build));
          if (releases.isEmpty || releases.first.build <= BuildConfig.versionCode) {
            if (!isAuto) {
              SmartDialog.showToast('已是最新版本');
            }
            return;
          }
          data = releases.first.data;
          hasUpdate = true;
          '''.strip('\n').split('\n')

          ANDROID_RELEASE_CLASS = r'''

          /// 本 fork 的 Android 正式版（对应 iOS 那边的 BtrIosRelease），只接受 prerelease == false：
          /// tag 形如 `v<版本>-btr.<构建号>-<sha12>-android`，附件是按 ABI 拆分的
          /// `PiliPlus-BTR-android-<版本>-btr.<构建号>-<abi>.apk`。
          final class BtrAndroidRelease {
            BtrAndroidRelease._(this.data, this.version, this.build);

            final Map<String, dynamic> data;
            final String version;
            final int build;

            static final _tagPattern = RegExp(
              r'^v(\d+\.\d+\.\d+)-btr\.([1-9]\d*)-[0-9a-f]{12}-android$',
            );

            static BtrAndroidRelease? parse(dynamic data) {
              if (data is! Map) return null;
              final json = Map<String, dynamic>.from(data);
              if (json['draft'] != false || json['prerelease'] != false) return null;
              final tag = json['tag_name'];
              if (tag is! String) return null;
              final match = _tagPattern.firstMatch(tag);
              if (match == null) return null;
              final build = int.tryParse(match[2]!);
              if (build == null) return null;
              final prefix = 'PiliPlus-BTR-android-${match[1]}-btr.$build-';
              final assets = json['assets'];
              if (assets is! List ||
                  !assets.any(
                    (asset) =>
                        asset is Map &&
                        asset['state'] == 'uploaded' &&
                        asset['name'] is String &&
                        (asset['name'] as String).startsWith(prefix) &&
                        (asset['name'] as String).endsWith('.apk'),
                  )) {
                return null;
              }
              return BtrAndroidRelease._(json, match[1]!, build);
            }
          }
          '''

          # ① 更新检查读的 releases 列表 → 本仓库
          patch(
              'lib/http/api.dart',
              'https://api.github.com/repos/aierlma/PiliPlus/releases',
              'https://api.github.com/repos/%s/releases' % REPO,
          )

          # ② 弹窗里「点此查看完整更新(即commit)内容」与下载兜底链接 → 本仓库
          patch(
              'lib/common/constants.dart',
              "  static const sourceCodeUrl = 'https://github.com/aierlma/PiliPlus';",
              "  static const sourceCodeUrl = 'https://github.com/%s';" % REPO,
          )

          # ③ 非 iOS 分支的判据 → 最新正式版的构建号 > 自身 versionCode
          replace_block('lib/utils/update.dart', OLD_BRANCH, NEW_BRANCH)

          # ④ 带上解析 Android 发布契约的类
          target = pathlib.Path('lib/utils/update.dart')
          text = target.read_text(encoding='utf-8')
          if 'BtrAndroidRelease' in text:
              print('::error::update.dart 里已经出现 BtrAndroidRelease，补丁可能被重复应用')
              sys.exit(1)
          target.write_text(text.rstrip('\n') + '\n' + ANDROID_RELEASE_CLASS,
                            encoding='utf-8')
          print('lib/utils/update.dart：已追加 BtrAndroidRelease')
          PY
          # 纯语法解析检查（只看能不能解析，不管格式），把写错 Dart 的代价从「构建十几分钟后失败」降到几秒。
          dart format --output=none lib/utils/update.dart

      # flutter test 会为整条依赖图构建 native assets，而依赖 cnativeapi 的 build hook 在 Linux 上
      # 要求 pkg-config 能找到 gtk+-3.0 / x11 / xi（macOS 上走别的分支，所以 aierlma 在 macos 上跑
      # 同样的测试不需要这些）。清单抄自本仓库自己的 Linux CI（linux_x64.yml），只额外补了报错点名的
      # libx11-dev / libxi-dev。
      - name: 安装 Linux 原生构建依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libx11-dev libxi-dev \
            libayatana-appindicator3-dev webkit2gtk-4.1 libasound2-dev libmpv-dev

      # 与 aierlma 那条完全相同的 BTR 测试（同一份代码、同一组文件）。这是**会阻断发布**的门禁：
      # 测试不通过就不发 release。
      # make_btr_mirror.py 必须先跑：它把 lib/services/btr_proxy/ 镜像到 test/standalone/btr/
      # 并生成最小桩，下面这 6 个 standalone 测试依赖这些生成物。
      # 失败时把「失败用例 + 断言」压成一条 ::error:: 注解（换行转义为 %0A），这样无需登录也能在
      # 运行页面读到根因；完整日志另外作为 artifact 上传。
      #
      # ⚠️ 下面这步修正的是**上游测试自身的构造缺陷**，不是放水：
      # btr_cdn_racer_test.dart 第 4 个用例想造"新最优 1.10 MB/s、未达 1.2× 迟滞"的场景，但它给
      # mock 的参数是"8 片 × 每片后延迟 7ms"≈ 49ms，算出来是 1.275 MB/s——**已经在 1.2× 阈值之上**，
      # 所以该用例只在定时器有额外开销（macOS 定时器粒度粗，每片多花约 2ms）时才碰巧通过；
      # ubuntu 定时器很准，于是实测失败（失败信息正是"现役 existing-cdn 被换成了 127.0.0.1:..."）。
      # 这里只把延迟 7ms 改成 10ms（≈0.94 MB/s），让它真正产出注释里写的那个场景。
      # 断言、阈值、被测实现一律未动。上游修好后删掉本步骤即可；补丁打不上时这里会直接失败，
      # 不会悄悄失效。
      - name: 修正上游那个自相矛盾的竞速测试参数
        run: |
          set -euo pipefail
          file=test/standalone/btr_cdn_racer_test.dart
          if ! grep -q 'delayMsPerChunk: 7)' "$file"; then
            echo "::error::上游测试里找不到 delayMsPerChunk: 7)，可能已被上游改掉，请核对后决定是否保留本补丁"
            exit 1
          fi
          sed -i 's/delayMsPerChunk: 7)/delayMsPerChunk: 10)/' "$file"
          if grep -q 'delayMsPerChunk: 7)' "$file"; then
            echo "::error::补丁未生效"
            exit 1
          fi
          grep -n 'delayMsPerChunk: 10)' "$file"

      - name: 跑 BTR 测试
        run: |
          set -euo pipefail
          if { python3 tool/make_btr_mirror.py && flutter test --no-pub \
                 test/utils/storage_pref_test.dart \
                 test/standalone/btr_bitrate_unit_test.dart \
                 test/standalone/btr_cdn_racer_test.dart \
                 test/standalone/btr_round22_test.dart \
                 test/standalone/btr_round23_test.dart \
                 test/standalone/btr_round26_test.dart; } 2>&1 | tee btr-test.log; then
            echo "BTR 测试全部通过"
          else
            detail=$(grep -A 16 -m 3 -e '❌' -e '\[E\]' btr-test.log || true)
            detail=$(printf '%s' "$detail" | head -n 60)
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\r'/''}
            detail=${detail//$'\n'/'%0A'}
            echo "::error::BTR 测试未全部通过，失败用例与断言：$detail"
            exit 1
          fi

      - name: 失败时上传测试日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: btr-test-log
          path: btr-test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: 写入签名密钥
        id: signing
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGN_KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::没有配置 SIGN_KEYSTORE_BASE64 等 secrets，本次 APK 使用 debug 签名（可安装，但签名与自建 keystore 的包不通用，无法互相覆盖安装）"
            exit 0
          fi
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          {
            echo "storeFile=key.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: 写版本号与 pili_release.json
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: 构建 release APK（按 ABI 拆分）
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --android-project-arg btr=1 --no-pub

      - name: 重命名并生成校验信息
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD: ${{ needs.resolve.outputs.build }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          UPSTREAM: ${{ needs.resolve.outputs.upstream }}
          BTR_UPSTREAM: ${{ needs.resolve.outputs.btr_upstream }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$file" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            mv "$file" "PiliPlus-BTR-android-${VERSION}-btr.${BUILD}-${abi}.apk"
          done
          ls -l PiliPlus-BTR-android-*.apk

          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess


          def signer_fingerprint(apk):
              # 从 APK 的 v1 签名块读出签名证书的 SHA-256 指纹，用来确认这份包到底是谁签的。
              # 任何失败都只记成说明文字，绝不让它中断发布。
              try:
                  out = subprocess.run(
                      ['keytool', '-printcert', '-jarfile', apk],
                      capture_output=True, text=True, timeout=60).stdout
              except Exception as error:
                  return 'unavailable: ' + str(error)
              for line in out.splitlines():
                  normalized = line.replace('SHA-256:', 'SHA256:')
                  if 'SHA256:' in normalized:
                      return normalized.split('SHA256:', 1)[1].strip().upper()
              return 'not found'


          apks = {}
          for path in sorted(pathlib.Path('.').glob('PiliPlus-BTR-android-*.apk')):
              data = path.read_bytes()
              apks[path.name] = {
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'size': len(data),
                  'signer_sha256': signer_fingerprint(str(path)),
              }

          info = {
              'tag': os.environ['TAG'],
              'version': os.environ['VERSION'],
              'build': os.environ['BUILD'],
              'source_sha': os.environ['SOURCE_SHA'],
              'official_upstream': os.environ['UPSTREAM'],
              'btr_upstream': os.environ['BTR_UPSTREAM'],
              'application_id': 'com.example.piliplus.btr',
              'apks': apks,
          }
          pathlib.Path('PiliPlus-BTR-android-build-info.json').write_text(
              json.dumps(info, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps(info, indent=2, ensure_ascii=False))
          PY

      # 发布前的最后一道闸：任何一项不过就 exit 1，整个 job 失败，坏包发不出去。
      # 相当于给 Android 补上 aierlma 那条流水线里的 verify_btr_ipa.py。
      - name: 校验 APK（Android 版 verify_btr_ipa）
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD: ${{ needs.resolve.outputs.build }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${version:-}" ]; then
            echo "::error::拿不到 build.ps1 写入的 version，无法校验版本名"
            exit 1
          fi
          export APP_VERSION="${version%%+*}"
          echo "期望：applicationId=com.example.piliplus.btr 版本名=$APP_VERSION build=$BUILD 已配置签名=$SIGNED"
          python3 - <<'PY'
          import glob, os, subprocess, sys, zipfile

          ABIS = ["arm64-v8a", "armeabi-v7a", "x86_64"]
          APP_ID = "com.example.piliplus.btr"
          VERSION = os.environ["VERSION"]
          BUILD = os.environ["BUILD"]
          APP_VERSION = os.environ["APP_VERSION"]
          SIGNED = os.environ.get("SIGNED", "")
          STORE_PASSWORD = os.environ.get("KEYSTORE_PASSWORD", "")
          KEY_ALIAS = os.environ.get("KEY_ALIAS", "")
          MIN_BYTES = 1024 * 1024
          problems = []


          def run_cmd(args):
              return subprocess.run(args, capture_output=True, text=True, errors="replace")


          def fail(message):
              problems.append(message)


          def parse_sha256(text):
              # 兼容三种写法：apksigner 的 "Signer #1 certificate SHA-256 digest: <hex>"、
              # keytool 的 "SHA256: AA:BB:..."、以及 "SHA-256:" 变体。
              # 注意 apksigner 的冒号在 digest 之后，所以要先定位到 sha256 之后的冒号再取十六进制串。
              for line in text.splitlines():
                  compact = line.replace(" ", "").replace("-", "").lower()
                  index = compact.find("sha256")
                  if index < 0:
                      continue
                  tail = compact[index + 6:]
                  colon = tail.find(":")
                  if colon < 0:
                      continue
                  value = "".join(ch for ch in tail[colon + 1:] if ch in "0123456789abcdef")
                  if len(value) >= 64:
                      return value[:64]
              return ""


          def apksigner_path():
              for root in (os.environ.get("ANDROID_HOME"), os.environ.get("ANDROID_SDK_ROOT")):
                  if not root:
                      continue
                  found = sorted(glob.glob(os.path.join(root, "build-tools", "*", "apksigner")))
                  if found:
                      return found[-1]
              return ""


          expected = ""
          if SIGNED == "true":
              if not STORE_PASSWORD:
                  fail("签名已启用，但读不到 KEYSTORE_PASSWORD，无法比对签名指纹")
              else:
                  out = run_cmd(["keytool", "-list", "-v", "-keystore", "android/app/key.jks",
                                 "-storepass", STORE_PASSWORD, "-alias", KEY_ALIAS])
                  expected = parse_sha256(out.stdout)
                  if expected:
                      print("keystore 里的签名证书 SHA-256:", expected)
                  else:
                      fail("读不出 keystore 的签名证书指纹（keytool -list -v 解析失败）")
          else:
              print("::warning::本次没有配置签名 secrets（APK 用 debug 签名），跳过签名指纹比对")

          apks = []
          for abi in ABIS:
              path = "PiliPlus-BTR-android-%s-btr.%s-%s.apk" % (VERSION, BUILD, abi)
              if not os.path.exists(path):
                  fail("%s 不存在" % path)
                  continue
              size = os.path.getsize(path)
              if size < MIN_BYTES:
                  fail("%s 只有 %d 字节，显然不完整" % (path, size))
              apks.append((abi, path))
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  libs = [n for n in names if n.startswith("lib/%s/" % abi) and n.endswith(".so")]
                  if not libs:
                      fail("%s 里没有 lib/%s/*.so，这个 ABI 的包是空的" % (path, abi))
                  try:
                      manifest = archive.read("AndroidManifest.xml").replace(b"\x00", b"")
                  except KeyError:
                      fail("%s 里没有 AndroidManifest.xml" % path)
                      manifest = b""
                  if manifest and APP_ID.encode() not in manifest:
                      fail("%s 的清单里没有 %s（btr 变体可能没生效，装上去会和官方版撞签名）" % (path, APP_ID))
                  if manifest and APP_VERSION.encode() not in manifest:
                      fail("%s 的清单里没有版本名 %s" % (path, APP_VERSION))
              print("%s：%d 字节，%d 个 %s native 库" % (path, size, len(libs), abi))

          if not apks:
              fail("没有任何 APK 可以校验")
          else:
              signer = apksigner_path()
              for abi, path in apks:
                  if signer:
                      out = run_cmd([signer, "verify", "--print-certs", path])
                      digest = parse_sha256(out.stdout)
                      if out.returncode != 0:
                          fail("%s 签名校验失败（apksigner 退出码 %d）：%s"
                               % (path, out.returncode, (out.stdout + out.stderr).strip()[:300]))
                          continue
                  else:
                      out = run_cmd(["keytool", "-printcert", "-jarfile", path])
                      digest = parse_sha256(out.stdout)
                  if not digest:
                      fail("%s 读不出签名证书指纹（apksigner 与 keytool 都失败）" % path)
                      continue
                  print("%s 签名证书 SHA-256：%s" % (path, digest))
                  if expected and digest != expected:
                      fail("%s 的签名证书 %s 与 keystore 的 %s 不一致（很可能静默回退成了 debug 签名）"
                           % (path, digest, expected))

          if problems:
              print("")
              print("APK 校验未通过，共 %d 项：" % len(problems))
              for problem in problems:
                  print(" - " + problem)
                  print("::error::" + problem)
              sys.exit(1)
          print("")
          print("APK 校验通过")
          PY

      # 这个 artifact 只是备用（release 才是主交付）。注意 upload-artifact 在 archive: false 时
      # 只允许传一个文件，而我们这里有 4 个，所以用默认的打包模式；再挂 continue-on-error，
      # 避免这一步失败时把后面的 release 发布一起拖下水。
      - name: 上传构建产物（打包成单个 artifact）
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: BTR-android-apks
          path: |
            PiliPlus-BTR-android-*.apk
            PiliPlus-BTR-android-build-info.json
          retention-days: 14

      - name: 发布 release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          # true = 同版本号的滚动重建（pre-release），false = 版本号变更的正式版。
          # action 文档明确「Drafts and prereleases cannot be set as latest」，所以 pre-release 不会抢
          # Latest，不需要 make_latest。判定逻辑见 resolve job 与文件头的「发布语义」。
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          name: PiliPlus BTR Android ${{ needs.resolve.outputs.version }} (build ${{ needs.resolve.outputs.build }})
          files: |
            PiliPlus-BTR-android-*.apk
            PiliPlus-BTR-android-build-info.json
          body: |
            PiliPlus BTR 安卓版（含 BTR 多 Range 并发加速），与 aierlma 的 iOS IPA 构建自同一个来源提交。

            - 版本：${{ needs.resolve.outputs.version }}（build ${{ needs.resolve.outputs.build }}）
            - 来源提交：`${{ needs.resolve.outputs.sha }}`
            - 官方 PiliPlus 上游：`${{ needs.resolve.outputs.upstream }}`
            - BTR 作者上游：`${{ needs.resolve.outputs.btr_upstream }}`
            - 应用 ID：`com.example.piliplus.btr`（可与官方版 `com.example.piliplus` 共存安装）
            - 签名：${{ steps.signing.outputs.signed == 'true' && '自有 keystore（release 签名）' || 'debug 签名（未配置签名 secrets）' }}

            附件为 3 个按 ABI 拆分的 APK（`arm64-v8a` / `armeabi-v7a` / `x86_64`），
            手机一般装 `arm64-v8a`；每个 APK 的 SHA-256 与签名证书指纹记录在 `PiliPlus-BTR-android-build-info.json` 里。

            构建来源：`.github/workflows/android-release.yml`（本仓库独立流水线，不影响上游的 IPA 发布）。

  record-failure:
    name: 失败时开 issue 记录现场
    needs: [resolve, build]
    if: ${{ always() && (needs.resolve.result == 'failure' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: 记录失败（仓库未启用 Issues 时自动跳过）
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM: ${{ needs.resolve.outputs.upstream }}
          BTR_UPSTREAM: ${{ needs.resolve.outputs.btr_upstream }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          # fork 默认关闭 Issues；没启用就直接跳过，别让记录失败本身再制造一次失败。
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" != "true" ]; then
            echo "::warning::$GITHUB_REPOSITORY 没有启用 Issues，跳过失败记录（Settings → Features 里勾上 Issues 即可）"
            exit 0
          fi

          label="${SHA:0:12}"
          [ -n "$label" ] || label="run-${GITHUB_RUN_ID}"
          title="Android APK 发布失败: $label"

          body=$(printf '本次运行失败：resolve=%s build=%s\n\n- 来源提交：`%s`\n- 目标 tag：`%s`\n- 官方 PiliPlus 上游：`%s`\n- BTR 作者上游：`%s`\n- 运行日志：%s\n\n这条流水线只构建 aierlma/PiliPlus 的 btr 提交并发布 APK，不合并上游、不改动 btr 分支与 IPA 发布。\n同一个来源提交的再次失败会追加在本 issue 下，而不是新开一个；排查完直接重跑即可（只有该 tag 已发过 release 需要覆盖时才需要勾 force）。\n' \
            "$RESOLVE_RESULT" "$BUILD_RESULT" "${SHA:-未取得}" "${TAG:-未取得}" "${UPSTREAM:-未取得}" "${BTR_UPSTREAM:-未取得}" "$RUN_URL")

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq ".[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "已把本次失败追加到 issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
