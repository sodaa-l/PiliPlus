# 独立的 Android APK 发布流水线
#
# 设计前提：完全不碰 aierlma 原有的 iOS 流水线（.github/workflows/btr-maintain.yml）
# 与发布脚本（tool/btr_release.py）——那两个文件里写死了 aierlma/PiliPlus 仓库名，
# 在 fork 里本来就会拒绝运行。本文件只做一件事：
#   构建 aierlma/PiliPlus 的 btr 最新提交 → 产出 3 个 ABI 拆分的 release APK → 打自己的 tag 发 release。
#   它不读也不改你 fork 的 btr 内容，只借一个专用分支 btr-android-build 寄存构建用的提交。
#
# 首次使用需要手动做三件事：
#   1. fork 的 Actions 页点「I understand my workflows, go ahead and enable them」；
#   2. 想让它每天自动跑，确认本 workflow 处于 Enabled 状态（fork 的 schedule 默认不生效）；
#   3. 可选：配置签名 secrets（SIGN_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），
#      不配置则回退为 debug 签名（能装，但签名与自建 release 签名不通用）。

name: BTR Android APK release

on:
  schedule:
    # 每天 UTC 12:47（北京时间 20:47）。aierlma 的 iOS 流水线是 UTC 11:17 触发，
    # 留出约 90 分钟让它先把合并后的 btr 分支推上去，这里才不会构建到旧代码。
    - cron: '47 12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 即使该版本已经发过 release，也重新构建并覆盖附件
        type: boolean
        default: false

concurrency:
  group: btr-android-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # aierlma/PiliPlus：BTR + 上游合并后的 btr 分支，本流水线的构建来源
  SOURCE_REPO: https://github.com/aierlma/PiliPlus.git
  # 官方 PiliPlus（仅用于在 build-info.json 里记录基线）
  UPSTREAM_REPO: https://github.com/bggRGjQaUbCoE/PiliPlus.git
  # BTR 作者的上游（仅用于在 build-info.json 里记录基线）
  BTR_UPSTREAM_REPO: https://github.com/nishuodedui1145-del/PiliPlus.git

jobs:
  resolve:
    name: 解析构建来源与目标 tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.target.outputs.skip }}
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.target.outputs.version }}
      build: ${{ steps.target.outputs.build }}
      tag: ${{ steps.target.outputs.tag }}
      upstream: ${{ steps.target.outputs.upstream }}
      btr_upstream: ${{ steps.target.outputs.btr_upstream }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: btr
          fetch-depth: 0
          persist-credentials: false

      - name: 解析来源提交、版本号与 tag
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # 恒定构建 aierlma/PiliPlus 的 btr 最新提交 —— 也就是它那些 IPA 对应的代码。
          # 不构建 fork 自己的 btr：你往 btr 上提交任何东西（包括本 workflow 文件）都会和上游分叉，
          # 那样只会一直构建旧代码。想让 fork 的 btr 也跟上，自己去点 Sync fork 即可。
          git fetch --no-tags "$SOURCE_REPO" btr
          target=$(git rev-parse FETCH_HEAD)

          git fetch --no-tags "$UPSTREAM_REPO" main
          upstream=$(git rev-parse FETCH_HEAD)
          git fetch --no-tags "$BTR_UPSTREAM_REPO" btr
          btr_upstream=$(git rev-parse FETCH_HEAD)

          version=$(git show "$target:pubspec.yaml" | sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' | head -n1)
          if [ -z "$version" ]; then
            echo "::error::无法从 $target 的 pubspec.yaml 解析版本号"
            exit 1
          fi
          build=$(git rev-list --count "$target")
          tag="v${version}-btr.${build}-${target:0:12}-android"

          # 同一个来源提交已经发过就直接跳过，省掉一次 30 分钟以上的构建。
          skip=false
          if [ "$FORCE" != "true" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag 已存在，跳过本次构建"
            skip=true
          fi

          {
            echo "sha=$target"
            echo "version=$version"
            echo "build=$build"
            echo "tag=$tag"
            echo "upstream=$upstream"
            echo "btr_upstream=$btr_upstream"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

  build:
    name: 构建 APK 并发布 release
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: btr
          fetch-depth: 0

      # build job 是全新的 runner，fork 里可能还没有 aierlma 那条流水线新推的提交，所以先取到目标提交。
      # release 的 tag 必须指向 fork 里真实存在的提交，所以把它寄存到专用分支 btr-android-build 上，
      # 完全不动你的 btr 分支。aierlma 的 btr 只会往前走，因此这是一条非强制的快进推送。
      - name: 取出目标提交并落到专用分支
        env:
          TARGET: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${TARGET}^{commit}" 2>/dev/null; then
            git fetch --no-tags "$SOURCE_REPO" btr
          fi
          if ! git cat-file -e "${TARGET}^{commit}" 2>/dev/null; then
            echo "::error::无法取得目标提交 $TARGET"
            exit 1
          fi
          git push origin "${TARGET}:refs/heads/btr-android-build"
          git checkout --detach "$TARGET"

      - name: 构建 Java 环境
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 打 Flutter SDK 与 material_ui 补丁（含 flutter pub get）
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      # flutter test 会为整条依赖图构建 native assets，而依赖 cnativeapi 的 build hook 在 Linux 上
      # 要求 pkg-config 能找到 gtk+-3.0 / x11 / xi（macOS 上走别的分支，所以 aierlma 在 macos 上跑
      # 同样的测试不需要这些）。清单抄自本仓库自己的 Linux CI（linux_x64.yml），只额外补了报错点名的
      # libx11-dev / libxi-dev。
      - name: 安装 Linux 原生构建依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libx11-dev libxi-dev \
            libayatana-appindicator3-dev webkit2gtk-4.1 libasound2-dev libmpv-dev

      # 与 aierlma 那条完全相同的 BTR 测试（同一份代码、同一组文件）。多花 1~3 分钟，换来的
      # 区别是：「发布的这份包通过了 BTR 测试」由本流水线自证，而不是靠相信上游。
      # make_btr_mirror.py 必须先跑：它把 lib/services/btr_proxy/ 镜像到 test/standalone/btr/
      # 并生成最小桩，下面这 6 个 standalone 测试依赖这些生成物。
      - name: 跑 BTR 测试
        run: |
          set -euo pipefail
          python3 tool/make_btr_mirror.py
          flutter test --no-pub \
            test/utils/storage_pref_test.dart \
            test/standalone/btr_bitrate_unit_test.dart \
            test/standalone/btr_cdn_racer_test.dart \
            test/standalone/btr_round22_test.dart \
            test/standalone/btr_round23_test.dart \
            test/standalone/btr_round26_test.dart

      - name: 写入签名密钥
        id: signing
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGN_KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::没有配置 SIGN_KEYSTORE_BASE64 等 secrets，本次 APK 使用 debug 签名（可安装，但签名与自建 keystore 的包不通用，无法互相覆盖安装）"
            exit 0
          fi
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          {
            echo "storeFile=key.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: 写版本号与 pili_release.json
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: 构建 release APK（按 ABI 拆分）
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --android-project-arg btr=1 --no-pub

      - name: 重命名并生成校验信息
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD: ${{ needs.resolve.outputs.build }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          UPSTREAM: ${{ needs.resolve.outputs.upstream }}
          BTR_UPSTREAM: ${{ needs.resolve.outputs.btr_upstream }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$file" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            mv "$file" "PiliPlus-BTR-android-${VERSION}-btr.${BUILD}-${abi}.apk"
          done
          ls -l PiliPlus-BTR-android-*.apk

          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess


          def signer_fingerprint(apk):
              # 从 APK 的 v1 签名块读出签名证书的 SHA-256 指纹，用来确认这份包到底是谁签的。
              # 任何失败都只记成说明文字，绝不让它中断发布。
              try:
                  out = subprocess.run(
                      ['keytool', '-printcert', '-jarfile', apk],
                      capture_output=True, text=True, timeout=60).stdout
              except Exception as error:
                  return 'unavailable: ' + str(error)
              for line in out.splitlines():
                  normalized = line.replace('SHA-256:', 'SHA256:')
                  if 'SHA256:' in normalized:
                      return normalized.split('SHA256:', 1)[1].strip().upper()
              return 'not found'


          apks = {}
          for path in sorted(pathlib.Path('.').glob('PiliPlus-BTR-android-*.apk')):
              data = path.read_bytes()
              apks[path.name] = {
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'size': len(data),
                  'signer_sha256': signer_fingerprint(str(path)),
              }

          info = {
              'tag': os.environ['TAG'],
              'version': os.environ['VERSION'],
              'build': os.environ['BUILD'],
              'source_sha': os.environ['SOURCE_SHA'],
              'official_upstream': os.environ['UPSTREAM'],
              'btr_upstream': os.environ['BTR_UPSTREAM'],
              'application_id': 'com.example.piliplus.btr',
              'apks': apks,
          }
          pathlib.Path('PiliPlus-BTR-android-build-info.json').write_text(
              json.dumps(info, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps(info, indent=2, ensure_ascii=False))
          PY

      # 发布前的最后一道闸：任何一项不过就 exit 1，整个 job 失败，坏包发不出去。
      # 相当于给 Android 补上 aierlma 那条流水线里的 verify_btr_ipa.py。
      - name: 校验 APK（Android 版 verify_btr_ipa）
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD: ${{ needs.resolve.outputs.build }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${version:-}" ]; then
            echo "::error::拿不到 build.ps1 写入的 version，无法校验版本名"
            exit 1
          fi
          export APP_VERSION="${version%%+*}"
          echo "期望：applicationId=com.example.piliplus.btr 版本名=$APP_VERSION build=$BUILD 已配置签名=$SIGNED"
          python3 - <<'PY'
          import glob, os, subprocess, sys, zipfile

          ABIS = ["arm64-v8a", "armeabi-v7a", "x86_64"]
          APP_ID = "com.example.piliplus.btr"
          VERSION = os.environ["VERSION"]
          BUILD = os.environ["BUILD"]
          APP_VERSION = os.environ["APP_VERSION"]
          SIGNED = os.environ.get("SIGNED", "")
          STORE_PASSWORD = os.environ.get("KEYSTORE_PASSWORD", "")
          KEY_ALIAS = os.environ.get("KEY_ALIAS", "")
          MIN_BYTES = 1024 * 1024
          problems = []


          def run_cmd(args):
              return subprocess.run(args, capture_output=True, text=True, errors="replace")


          def fail(message):
              problems.append(message)


          def parse_sha256(text):
              # 兼容三种写法：apksigner 的 "Signer #1 certificate SHA-256 digest: <hex>"、
              # keytool 的 "SHA256: AA:BB:..."、以及 "SHA-256:" 变体。
              # 注意 apksigner 的冒号在 digest 之后，所以要先定位到 sha256 之后的冒号再取十六进制串。
              for line in text.splitlines():
                  compact = line.replace(" ", "").replace("-", "").lower()
                  index = compact.find("sha256")
                  if index < 0:
                      continue
                  tail = compact[index + 6:]
                  colon = tail.find(":")
                  if colon < 0:
                      continue
                  value = "".join(ch for ch in tail[colon + 1:] if ch in "0123456789abcdef")
                  if len(value) >= 64:
                      return value[:64]
              return ""


          def apksigner_path():
              for root in (os.environ.get("ANDROID_HOME"), os.environ.get("ANDROID_SDK_ROOT")):
                  if not root:
                      continue
                  found = sorted(glob.glob(os.path.join(root, "build-tools", "*", "apksigner")))
                  if found:
                      return found[-1]
              return ""


          expected = ""
          if SIGNED == "true":
              if not STORE_PASSWORD:
                  fail("签名已启用，但读不到 KEYSTORE_PASSWORD，无法比对签名指纹")
              else:
                  out = run_cmd(["keytool", "-list", "-v", "-keystore", "android/app/key.jks",
                                 "-storepass", STORE_PASSWORD, "-alias", KEY_ALIAS])
                  expected = parse_sha256(out.stdout)
                  if expected:
                      print("keystore 里的签名证书 SHA-256:", expected)
                  else:
                      fail("读不出 keystore 的签名证书指纹（keytool -list -v 解析失败）")
          else:
              print("::warning::本次没有配置签名 secrets（APK 用 debug 签名），跳过签名指纹比对")

          apks = []
          for abi in ABIS:
              path = "PiliPlus-BTR-android-%s-btr.%s-%s.apk" % (VERSION, BUILD, abi)
              if not os.path.exists(path):
                  fail("%s 不存在" % path)
                  continue
              size = os.path.getsize(path)
              if size < MIN_BYTES:
                  fail("%s 只有 %d 字节，显然不完整" % (path, size))
              apks.append((abi, path))
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  libs = [n for n in names if n.startswith("lib/%s/" % abi) and n.endswith(".so")]
                  if not libs:
                      fail("%s 里没有 lib/%s/*.so，这个 ABI 的包是空的" % (path, abi))
                  try:
                      manifest = archive.read("AndroidManifest.xml").replace(b"\x00", b"")
                  except KeyError:
                      fail("%s 里没有 AndroidManifest.xml" % path)
                      manifest = b""
                  if manifest and APP_ID.encode() not in manifest:
                      fail("%s 的清单里没有 %s（btr 变体可能没生效，装上去会和官方版撞签名）" % (path, APP_ID))
                  if manifest and APP_VERSION.encode() not in manifest:
                      fail("%s 的清单里没有版本名 %s" % (path, APP_VERSION))
              print("%s：%d 字节，%d 个 %s native 库" % (path, size, len(libs), abi))

          if not apks:
              fail("没有任何 APK 可以校验")
          else:
              signer = apksigner_path()
              for abi, path in apks:
                  if signer:
                      out = run_cmd([signer, "verify", "--print-certs", path])
                      digest = parse_sha256(out.stdout)
                      if out.returncode != 0:
                          fail("%s 签名校验失败（apksigner 退出码 %d）：%s"
                               % (path, out.returncode, (out.stdout + out.stderr).strip()[:300]))
                          continue
                  else:
                      out = run_cmd(["keytool", "-printcert", "-jarfile", path])
                      digest = parse_sha256(out.stdout)
                  if not digest:
                      fail("%s 读不出签名证书指纹（apksigner 与 keytool 都失败）" % path)
                      continue
                  print("%s 签名证书 SHA-256：%s" % (path, digest))
                  if expected and digest != expected:
                      fail("%s 的签名证书 %s 与 keystore 的 %s 不一致（很可能静默回退成了 debug 签名）"
                           % (path, digest, expected))

          if problems:
              print("")
              print("APK 校验未通过，共 %d 项：" % len(problems))
              for problem in problems:
                  print(" - " + problem)
              sys.exit(1)
          print("")
          print("APK 校验通过")
          PY

      # 这个 artifact 只是备用（release 才是主交付）。注意 upload-artifact 在 archive: false 时
      # 只允许传一个文件，而我们这里有 4 个，所以用默认的打包模式；再挂 continue-on-error，
      # 避免这一步失败时把后面的 release 发布一起拖下水。
      - name: 上传构建产物（打包成单个 artifact）
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: BTR-android-apks
          path: |
            PiliPlus-BTR-android-*.apk
            PiliPlus-BTR-android-build-info.json
          retention-days: 14

      - name: 发布 release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          name: PiliPlus BTR Android ${{ needs.resolve.outputs.version }} (build ${{ needs.resolve.outputs.build }})
          files: |
            PiliPlus-BTR-android-*.apk
            PiliPlus-BTR-android-build-info.json
          body: |
            PiliPlus BTR 安卓版（含 BTR 多 Range 并发加速），与 aierlma 的 iOS IPA 构建自同一个来源提交。

            - 版本：${{ needs.resolve.outputs.version }}（build ${{ needs.resolve.outputs.build }}）
            - 来源提交：`${{ needs.resolve.outputs.sha }}`
            - 官方 PiliPlus 上游：`${{ needs.resolve.outputs.upstream }}`
            - BTR 作者上游：`${{ needs.resolve.outputs.btr_upstream }}`
            - 应用 ID：`com.example.piliplus.btr`（可与官方版 `com.example.piliplus` 共存安装）
            - 签名：${{ steps.signing.outputs.signed == 'true' && '自有 keystore（release 签名）' || 'debug 签名（未配置签名 secrets）' }}

            附件为 3 个按 ABI 拆分的 APK（`arm64-v8a` / `armeabi-v7a` / `x86_64`），
            手机一般装 `arm64-v8a`；每个 APK 的 SHA-256 与签名证书指纹记录在 `PiliPlus-BTR-android-build-info.json` 里。

            构建来源：`.github/workflows/android-release.yml`（本仓库独立流水线，不影响上游的 IPA 发布）。

  record-failure:
    name: 失败时开 issue 记录现场
    needs: [resolve, build]
    if: ${{ always() && (needs.resolve.result == 'failure' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: 记录失败（仓库未启用 Issues 时自动跳过）
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM: ${{ needs.resolve.outputs.upstream }}
          BTR_UPSTREAM: ${{ needs.resolve.outputs.btr_upstream }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          # fork 默认关闭 Issues；没启用就直接跳过，别让记录失败本身再制造一次失败。
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" != "true" ]; then
            echo "::warning::$GITHUB_REPOSITORY 没有启用 Issues，跳过失败记录（Settings → Features 里勾上 Issues 即可）"
            exit 0
          fi

          label="${SHA:0:12}"
          [ -n "$label" ] || label="run-${GITHUB_RUN_ID}"
          title="Android APK 发布失败: $label"

          body=$(printf '本次运行失败：resolve=%s build=%s\n\n- 来源提交：`%s`\n- 目标 tag：`%s`\n- 官方 PiliPlus 上游：`%s`\n- BTR 作者上游：`%s`\n- 运行日志：%s\n\n这条流水线只构建 aierlma/PiliPlus 的 btr 提交并发布 APK，不合并上游、不改动 btr 分支与 IPA 发布。\n同一个来源提交的再次失败会追加在本 issue 下，而不是新开一个；排查完直接重跑即可（只有该 tag 已发过 release 需要覆盖时才需要勾 force）。\n' \
            "$RESOLVE_RESULT" "$BUILD_RESULT" "${SHA:-未取得}" "${TAG:-未取得}" "${UPSTREAM:-未取得}" "${BTR_UPSTREAM:-未取得}" "$RUN_URL")

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq ".[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "已把本次失败追加到 issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
